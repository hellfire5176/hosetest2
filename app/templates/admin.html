<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Setup - Fire Hose Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white">
<div class="container py-5" style="max-width: 450px;">
    <div class="card bg-secondary text-white border-0 shadow-lg">
        <div class="card-body p-4">
            <h3 class="card-title text-center text-warning mb-4">⚙️ Initial Admin Setup</h3>
            <p class="small text-light mb-4">The database is currently empty. The first credentials submitted below will configure the primary administrative account.</p>
            <form action="/admin" method="POST">
                <div class="mb-3">
                    <label class="form-label text-white">Username</label>
                    <input type="text" name="username" class="form-control bg-dark text-white border-0" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-white">Password</label>
                    <input type="password" name="password" class="form-control bg-dark text-white border-0" required>
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold">Provision Administrator Account</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
