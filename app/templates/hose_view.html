<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hose Scan - Fire Hose Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 500px;">
    <div class="card border-0 shadow-sm text-center">
        <div class="card-body p-4">
            <h2 class="h4 mb-3">🧯 Hose Record</h2>
            <hr>
            <h1 class="display-5 text-primary my-2">{{ hose.id }}</h1>
            <p class="lead mb-1">{{ hose.size_inches }}" x {{ hose.length_feet }}' {{ hose.hose_type }} Line</p>
            <div class="my-3">
                <span class="badge {% if hose.status == 'In Service' %}bg-success{% elif hose.status == 'Failed' %}bg-danger{% else %}bg-warning text-dark{% endif %} p-2 px-3 fs-6">
                    Status: {{ hose.status }}
                </span>
            </div>
            <p class="text-muted small">Token Secured: <code>{{ hose.scan_token[:12] }}...</code></p>
            <a href="/" class="btn btn-outline-secondary w-100 mt-3">Return to Main Hub</a>
        </div>
    </div>
</div>
</body>
</html>
