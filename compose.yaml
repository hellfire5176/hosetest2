services:
  fire-hose-manager:
    image: ghcr.io/YOUR-GITHUB-USERNAME/fire-hose-manager:latest
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      SECRET_KEY: "CHANGE-THIS-TO-A-LONG-RANDOM-SECRET"
      DATABASE_PATH: "/app/data/hose.db"
      TZ: "America/Toronto"
    volumes:
      - /mnt/tank/apps/fire-hose-manager/data:/app/data
